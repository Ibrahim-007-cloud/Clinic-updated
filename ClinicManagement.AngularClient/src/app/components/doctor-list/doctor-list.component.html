<div class="page-header">
  <h1>🩺 Doctor Directory</h1>
  <p>View and manage all registered doctors</p>
</div>

<div class="clinic-card">
  <div class="search-bar">
    <h3 style="margin:0; color:#333;">All Doctors</h3>
    <button class="btn-add" (click)="addDoctor()">+ Add Doctor</button>
  </div>

  <div *ngIf="errorMessage" class="alert-error">⚠️ {{ errorMessage }}</div>

  <table class="clinic-table">
    <thead>
      <tr>
        <th>#</th>
        <th>Doctor Name</th>
        <th>Specialization</th>
        <th>Total Visits</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let d of doctors; let i = index">
        <td>{{ i + 1 }}</td>
        <td><strong>{{ d.name }}</strong></td>
        <td><span class="badge-male">{{ d.specialization }}</span></td>
        <td>{{ d.totalVisits ?? 0 }} visits</td>
        <td>
          <button class="btn-edit" (click)="editDoctor(d.id)">✏️ Edit</button>
          <button class="btn-delete" (click)="deleteDoctor(d.id)">🗑️ Delete</button>
        </td>
      </tr>
      <tr *ngIf="doctors.length === 0">
        <td colspan="5">
          <div class="empty-state">
            <div class="icon">🩺</div>
            <p>No doctors found. Click <strong>+ Add Doctor</strong> to get started.</p>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
