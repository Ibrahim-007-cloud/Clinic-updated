<div class="page-header">
  <h1>👤 {{ isEdit ? 'Edit Patient' : 'Add New Patient' }}</h1>
  <p>{{ isEdit ? 'Modify existing patient data' : 'Create a new profile for a patient' }}</p>
</div>

<div class="clinic-card">
  <div *ngIf="errorMessage" class="alert-error">⚠️ {{ errorMessage }}</div>
  <div *ngIf="successMessage" class="alert-success">✅ {{ successMessage }}</div>

  <form (ngSubmit)="onSubmit()" #patientForm="ngForm" class="clinic-form">
    
    <div class="form-group">
      <label for="name">Patient Name</label>
      <input 
        type="text" 
        id="name" 
        class="form-control" 
        [(ngModel)]="patient.name" 
        name="name" 
        placeholder="Enter full name"
        required />
    </div>

    <div class="form-group">
      <label for="age">Age</label>
      <input 
        type="number" 
        id="age" 
        class="form-control" 
        [(ngModel)]="patient.age" 
        name="age" 
        placeholder="Enter age"
        required />
    </div>

    <div class="form-group">
      <label for="gender">Gender</label>
      <select 
        id="gender" 
        class="form-control" 
        [(ngModel)]="patient.gender" 
        name="gender" 
        required>
        <option value="">Select Gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <div class="form-group">
      <label for="contact">Contact Number</label>
      <input 
        type="text" 
        id="contact" 
        class="form-control" 
        [(ngModel)]="patient.contact" 
        name="contact" 
        placeholder="📞 Enter contact or phone number"
        required />
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-add" [disabled]="!patientForm.form.valid">
        {{ isEdit ? '🔄 Update Patient' : '💾 Save Patient' }}
      </button>
      <button type="button" class="btn-delete" style="background-color: #6c757d;" (click)="cancel()">
        Cancel
      </button>
    </div>

  </form>
</div>
