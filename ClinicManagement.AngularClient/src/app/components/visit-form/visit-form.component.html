<div style="padding: 30px;">
  <div class="form-container">
    <div class="form-header">
      <h2>{{ isEdit ? '✏️ Edit Visit' : '📋 Log New Visit' }}</h2>
      <p>{{ isEdit ? 'Update visit details below' : 'Record a new patient visit' }}</p>
    </div>
    <div class="form-body">
      <div *ngIf="errorMessage" class="alert-error">⚠️ {{ errorMessage }}</div>
      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label class="form-label">Select Patient</label>
          <select class="form-control" [(ngModel)]="visit.patientId" name="patientId" required>
            <option value="0">Choose a patient...</option>
            <option *ngFor="let p of patients" [value]="p.id">{{ p.name }}</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Select Doctor</label>
          <select class="form-control" [(ngModel)]="visit.doctorId" name="doctorId" required>
            <option value="0">Choose a doctor...</option>
            <option *ngFor="let d of doctors" [value]="d.id">{{ d.name }} — {{ d.specialization }}</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Problem / Symptoms</label>
          <textarea class="form-control" [(ngModel)]="visit.problem" name="problem" required rows="3" placeholder="Describe the patient's problem or symptoms..."></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Visit Date</label>
          <input class="form-control" [(ngModel)]="visit.visitDate" name="visitDate" type="date" required />
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-submit">{{ isEdit ? '✅ Update Visit' : '💾 Save Visit' }}</button>
          <button type="button" class="btn-cancel" (click)="cancel()">✖ Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>
